<svg xmlns="http://www.w3.org/2000/svg" width="800" height="18" viewBox="0 0 800 18">
  <defs>
    <linearGradient id="gline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b5a2a"/>
      <stop offset="50%" stop-color="#FFD700"/>
