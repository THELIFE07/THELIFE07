<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6">
  <defs>
    <linearGradient id="slide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b5a2a"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#6b5a2a"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="6" rx="3" fill="url(#slide)"/>
</svg>
