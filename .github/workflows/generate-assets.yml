name: Generate Profile Assets

on:
  schedule:
    - cron: "31 0 * * *" # daily at 00:31 UTC
  workflow_dispatch: # manual trigger
  push:
    branches: [main]

# Prevent zombie runs from racing & force-pushing stale bundles over fresh ones
concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats (self-hosted — no flaky external services)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: THELIFE07
          filename: dist/metrics.svg
          committer_branch: output
          config_timezone: UTC # anonymous — never leak real timezone
          config_display: large
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8

      - name: Generate snake SVGs (gold on black / gold on light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: THELIFE07
          outputs: |
            dist/github-snake.svg?color_snake=%23B8860B&color_dots=%23f0f0f0,%23e8d9a0,%23d9bd5c,%23c9a227,%23FFD700
            dist/github-snake-dark.svg?color_snake=%23FFD700&color_dots=%23161b22,%232a2410,%23524014,%238a6d1d,%23FFD700

      - name: Pull metrics.svg into bundle (via API — raw CDN serves stale copies)
        run: |
          curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/dist/metrics.svg?ref=output" \
            -o dist/metrics.svg \
            && echo "metrics.svg fetched fresh via API ($(wc -c < dist/metrics.svg) bytes)" \
            || echo "WARN: metrics.svg not fetched — retry next run"

      - name: Recolor metrics.svg to black & gold premium theme
        run: |
          python3 - <<'PYEOF'
          import re
          p = "dist/metrics.svg"
          s = open(p).read()
          # black card background inserted right after <svg ...> opening tag
          s = re.sub(r"(<svg\b[^>]*>)",
                     r'\1<rect width="100%" height="100%" fill="#0a0a0a" rx="16"/>',
                     s, count=1)
          # GitHub light palette -> gold on black (text), dark panels (fills)
          remap = {
              "#777": "#d4af37", "#666": "#a4863c", "#959da5": "#8a6d1d",
              "#0366d6": "#FFD700", "#24292f": "#FFD700", "#57606a": "#c9a227",
              "#216e39": "#B8860B", "#9be9a8": "#D4AF37", "#ebedf0": "#1f1f1f",
              "#e1e4e8": "#2a2a2a", "#d0d7de": "#2f2f2f", "#dfe3e8": "#262626",
              "#8c959f": "#8a6d1d", "#afb8c1": "#6b5a2a",
              "#fafafa": "#141414", "#f6f8fa": "#141414",
          }
          for a, b in remap.items():
              s = s.replace(a, b)
          open(p, "w").write(s)
          print("metrics.svg recolored: black card + gold text")
          PYEOF

      - name: Bundle all self-hosted animations
        run: cp .github/assets/*.svg dist/

      - name: Push everything to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
