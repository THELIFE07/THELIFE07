name: Generate Profile Assets

on:
  schedule:
    - cron: "31 0 * * *" # daily at 00:31 UTC
  workflow_dispatch: # manual trigger
  push:
    branches: [main]

# Prevent zombie runs from racing & force-pushing stale bundles over fresh ones
concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats (self-hosted — no flaky external services)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: THELIFE07
          filename: dist/metrics.svg
          committer_branch: output
          config_timezone: Asia/Kathmandu
          config_display: large
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_threshold: C

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: THELIFE07
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Copy typing animation into bundle
        run: cp .github/assets/typing.svg dist/typing.svg

      - name: Pull metrics.svg into bundle (metrics commits it to output/dist)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/dist/metrics.svg" -o dist/metrics.svg \
            && echo "metrics.svg fetched ($(wc -c < dist/metrics.svg) bytes)" \
            || echo "WARN: metrics.svg not fetched — will retry next run"

      - name: Push everything to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
